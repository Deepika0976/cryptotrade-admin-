
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CryptoTrade Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#08111f;color:#edf4ff;font:15px Arial,sans-serif}
main{max-width:1000px;margin:30px auto;padding:18px}
.card{background:#111e30;border:1px solid #263b55;border-radius:14px;padding:20px;margin:15px 0}
input,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #344a65;background:#091626;color:white}
button{background:#1677e8;border:0;font-weight:bold}
button:disabled{opacity:.5}
.hidden{display:none}
small{color:#a8bad0}
table{width:100%;border-collapse:collapse;min-width:500px}
th,td{text-align:left;padding:10px;border-bottom:1px solid #263b55}
.tablebox{overflow:auto}
#status{white-space:pre-wrap;color:#77e0bd}
</style>
</head>
<body>
<main>
  <h1>CryptoTrade</h1>
  <p><small>Secure Admin Panel</small></p>

  <section id="login" class="card">
    <h2>Admin Login</h2>
    <input id="email" type="email" placeholder="Admin email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn" onclick="login()">Sign In</button>
    <p id="status"></p>
  </section>

  <section id="panel" class="hidden">
    <div class="card">
      <h2>Dashboard</h2>
      <p id="welcome">Checking administrator access...</p>
      <button onclick="loadUsers()">Refresh Users</button>
      <button onclick="logout()">Sign Out</button>
    </div>

    <div class="card">
      <h2>User Management</h2>
      <input id="search" placeholder="Search username or user ID"
             oninput="showUsers()">
      <div class="tablebox">
        <table>
          <thead><tr>
            <th>User ID</th><th>Username</th><th>Created</th>
          </tr></thead>
          <tbody id="users"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>Balance Management</h2>
      <p><small>Enter an existing User ID. Changes require administrator access.</small></p>
      <input id="balanceUser" type="number" placeholder="User ID">
      <input id="balanceAmount" type="number" min="0.01" step="0.01"
             placeholder="Amount">
      <input id="balanceReason" placeholder="Reason for adjustment">
      <button onclick="adjustBalance('add')">Add Balance</button>
      <button onclick="adjustBalance('remove')">Remove Balance</button>
    </div>
    <p id="statusPanel"></p>
  </section>
</main>

<script>
const SUPABASE_URL = "https://pgmknttganaruiwqyfwq.supabase.co";
const SUPABASE_KEY = "sb_publishable_J5AaqG44SVQSh8ggcHouig_W79XKN5s";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let users = [];
let busy = false;

function message(text, panel = false) {
  document.getElementById(panel ? "statusPanel" : "status").textContent = text;
}

async function login() {
  if (busy) return;
  busy = true;
  document.getElementById("loginBtn").disabled = true;
  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) throw error;
    await checkAdmin();
  } catch (e) {
    message("Login failed: " + e.message);
  } finally {
    busy = false;
    document.getElementById("loginBtn").disabled = false;
  }
}

async function checkAdmin() {
  const { data: { user }, error: userError } = await db.auth.getUser();
  if (userError || !user) {
    document.getElementById("login").classList.remove("hidden");
    document.getElementById("panel").classList.add("hidden");
    return;
  }

  const { data, error } = await db.rpc("is_admin");
  if (error || data !== true) {
    await db.auth.signOut();
    throw new Error("This account is not authorized as an administrator.");
  }

  document.getElementById("login").classList.add("hidden");
  document.getElementById("panel").classList.remove("hidden");
  document.getElementById("welcome").textContent =
    "Signed in as " + user.email + " — administrator verified.";
  await loadUsers();
}

async function loadUsers() {
  message("Loading users...", true);
  const { data, error } = await db
    .from("profiles")
    .select("id, username, created_at")
    .order("id", { ascending: true })
    .limit(500);

  if (error) {
    message("Could not load users: " + error.message, true);
    return;
  }

  users = data || [];
  showUsers();
  message("Loaded " + users.length + " user records.", true);
}

function showUsers() {
  const q = document.getElementById("search").value.toLowerCase();
  const rows = users.filter(u =>
    String(u.id).includes(q) ||
    String(u.username).toLowerCase().includes(q)
  );

  document.getElementById("users").innerHTML = rows.map(u => `
    <tr>
      <td>${escapeHtml(u.id)}</td>
      <td>${escapeHtml(u.username)}</td>
      <td>${escapeHtml(u.created_at || "")}</td>
    </tr>
  `).join("") || '<tr><td colspan="3">No users found.</td></tr>';
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

async function adjustBalance(action) {
  const id = Number(document.getElementById("balanceUser").value);
  const amount = Number(document.getElementById("balanceAmount").value);
  const reason = document.getElementById("balanceReason").value.trim();

  if (!Number.isSafeInteger(id) || id < 5001 ||
      !Number.isFinite(amount) || amount <= 0 || !reason) {
    message("Enter a valid User ID, positive amount and reason.", true);
    return;
  }

  message("Balance adjustment is not enabled yet.", true);
  message(
    "For safety, balance changes require a transaction-safe database function " +
    "and an audit log. These must be installed and tested before this action is enabled.",
    true
  );
}

async function logout() {
  await db.auth.signOut();
  document.getElementById("panel").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  message("You have signed out.");
}

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT" || !session) {
    document.getElementById("panel").classList.add("hidden");
    document.getElementById("login").classList.remove("hidden");
  }
});

checkAdmin().catch(e => message(e.message));
</script>
</body>
</html>
